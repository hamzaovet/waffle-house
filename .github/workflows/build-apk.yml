name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK & Prepare Asset
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/waffle-house.apk
          ls -lh dist-apk/waffle-house.apk

      - name: Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log
          tail -n 300 gradle-build.log > gradle-error.txt || true
          git add gradle-error.txt
          git commit -m "chore: upload gradle error log" || true
          git push origin build-log -f || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waffle-house-apk
          path: dist-apk/waffle-house.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.5
          name: "Waffle House Cairo Android App v1.0.5"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🧇 تطبيق Waffle House (وافل هاوس - القاهرة) للأندرويد - النسخة الرسمية v1.0.5
            
            أهلاً بكم في تطبيق Waffle House للأندرويد - فرع حدائق القبة (شارع مصر والسودان - بجوار حلواني الشيبي - القاهرة)!
            
            ### 📱 مميزات التطبيق:
            - تجربة طلب تيك أواي ودليفري سريعة وفورية لكافة مناطق القاهرة
            - متابعة مباشرة لحالة الطلب لحظة بلحظة مع تنبيهات صوتية فورية
            - قائمة المنيو الكاملة الفاخرة للوافل والبان كيك والموتشي والبوبا وكافة الحلويات
            - ماكينة كاشير وبيع مباشر وطباعة فواتير ريسيت 80mm
            
            ### 📥 طريقة التثبيت:
            1. اضغط على رابط التحميل المباشر بالأسفل `waffle-house.apk`.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. إذا ظهرت رسالة الأمان في هاتفك، اختر **السماح بالتثبيت من هذا المصدر**.
            4. افتح التطبيق واستمتع بأشهى وافل وحلويات!
          files: dist-apk/waffle-house.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
